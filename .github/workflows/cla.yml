name: CLA

# Contributors sign the CLA (CLA.md) by commenting on their first pull request.
# Signatures are stored in this repository, on the `cla-signatures` branch
# (signatures/cla.json), so no external service holds them. The workflow runs
# from the base branch with pull_request_target and never checks out or runs
# the pull request's code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Pagefirst Contributor License Agreement and agree to it.'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/thegreenbot/pagefirst/blob/develop/CLA.md
          branch: cla-signatures
          # The maintainer and automation are exempt.
          allowlist: thegreenbot,dependabot[bot],github-actions[bot],claude[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/thegreenbot/pagefirst/blob/develop/CLA.md)
            and sign it by replying with the exact sentence below.
          custom-pr-sign-comment: I have read the Pagefirst Contributor License Agreement and agree to it.
          custom-allsigned-prcomment: All contributors have signed the CLA.
          lock-pullrequest-aftermerge: false
