name: Theme publish

# Publishes a first-party theme version to the registry (#64) when a release
# tag is pushed: theme-<dir>-v<version>, e.g. theme-editorial-v1.0.1 for
# themes/editorial at version 1.0.1. There is no upload secret: the registry
# accepts this workflow's GitHub OIDC token, issued for this repository, this
# file and this tag only. See runbooks/theme-registry.md.
on:
  push:
    tags:
      - "theme-*-v*"

permissions:
  contents: read

concurrency:
  group: theme-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: theme-registry
    permissions:
      contents: read
      # OIDC token for the registry, and Sigstore keyless signing.
      id-token: write
      # Store the build-provenance attestation with the repository.
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^theme-([a-z0-9-]+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag $TAG is not theme-<dir>-v<version>"
            exit 1
          fi
          echo "dir=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Byte and Lighthouse budgets
        run: |
          npx playwright install --with-deps chromium
          npx tsx scripts/theme-budgets.ts --lighthouse --theme "$DIR" --scores scores.json
        env:
          DIR: ${{ steps.tag.outputs.dir }}

      - name: Pack
        run: npx tsx scripts/theme-pack.ts "themes/$DIR" theme.tgz "$VERSION"
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Attest build provenance (Sigstore, keyless)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: theme.tgz

      # Full Sigstore verification (certificate chain to Sigstore's root and the
      # transparency log) before anything is uploaded.
      - name: Verify the attestation
        run: gh attestation verify theme.tgz --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/theme-publish.yml"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload to the registry
        env:
          REGISTRY_URL: ${{ vars.THEME_REGISTRY_URL }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if [ -z "$REGISTRY_URL" ]; then
            echo "::error::Set the THEME_REGISTRY_URL variable on the theme-registry environment"
            exit 1
          fi
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pagefirst-theme-registry" | jq -r .value)
          echo "::add-mask::$token"
          jq -n --rawfile archive <(base64 -w0 theme.tgz) --slurpfile scores scores.json --slurpfile attestation "$BUNDLE" \
            '{archive: $archive, scores: $scores[0], attestation: $attestation[0]}' > body.json
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$REGISTRY_URL/api/registry/versions" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" --data-binary @body.json)
          cat response.json; echo
          if [ "$status" != "201" ]; then
            echo "::error::Registry answered $status"
            exit 1
          fi
