name: CodeQL

on:
  pull_request:
  merge_group:
  # develop is covered by its PRs; main gets a full scan on every release.
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    steps:
      # Docs-only PRs have nothing to analyse. The job still reports success,
      # which keeps the required check satisfied, and the steps below skip.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && files=$(gh pr diff "$PR" --repo "$REPO" --name-only 2>/dev/null) && [ -n "$files" ]; then
            if echo "$files" | grep -qE '\.(ts|tsx|js|jsx|mjs|cjs|mts|cts)$|^\.github/workflows/codeql\.yml$'; then code=true; else code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.diff.outputs.code == 'true'
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - if: steps.diff.outputs.code == 'true'
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:javascript-typescript
