name: Dependency review

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Only manifests and lockfiles can add a dependency. Other PRs skip the
      # steps below and the required check still reports success.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          deps=true
          if [ "$EVENT" = "pull_request" ] && files=$(gh pr diff "$PR" --repo "$REPO" --name-only 2>/dev/null) && [ -n "$files" ]; then
            if echo "$files" | grep -qE '(^|/)(package(-lock)?\.json|\.github/workflows/[^/]+\.ya?ml|\.github/dependabot\.yml)$|(^|/)(requirements[^/]*\.txt|go\.(mod|sum)|Cargo\.(toml|lock)|\.terraform\.lock\.hcl)$'; then deps=true; else deps=false; fi
          fi
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.deps == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.diff.outputs.deps == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Fails when a PR adds or upgrades to a package with a high or critical advisory.
          fail-on-severity: high
          # Only these licenses may be introduced. Add to the list deliberately.
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            CC0-1.0, CC-BY-4.0, BlueOak-1.0.0, Unlicense, Python-2.0, MPL-2.0
          comment-summary-in-pr: on-failure
